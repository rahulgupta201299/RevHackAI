<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevHack AI — AI-first product engineering studio</title>
    <meta
      name="description"
      content="AI-first full-stack engineering: we build, ship and deploy complete products — frontend, Node.js backend, data and AWS cloud — engineered to scale your business 2–4×."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved/system colour scheme before first paint to avoid a theme flash.
      (function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RevHack AI — AI-first product engineering studio" />
    <meta
      property="og:description"
      content="Build, ship and scale your product end to end — full-stack, Node.js, AWS and AI."
    />
    <meta property="og:url" content="https://revhackai.in/" />
    <meta property="og:image" content="https://revhackai.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RevHack AI modular RH logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RevHack AI — AI-first product engineering studio" />
    <meta
      name="twitter:description"
      content="Build, ship and scale your product end to end — full-stack, Node.js, AWS and AI."
    />
    <meta name="twitter:image" content="https://revhackai.in/og-image.png" />
  </head>

    <noscript>This site needs JavaScript enabled to display its content.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
